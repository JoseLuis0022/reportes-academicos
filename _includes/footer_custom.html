{% assign modified =
  page.last_modified_at
  | default: page.last_modified
  | default: page.date
  | default: site.time %}

<footer class="custom-footer" role="contentinfo">
  <img
    src="{{ '/assets/img/perfil.jpeg' | relative_url }}"
    alt="Foto de perfil de JoseLuis0022"
    class="custom-footer__avatar"
    width="48"
    height="48"
    loading="lazy"
  >
  <div class="custom-footer__info">
    <p class="custom-footer__copy">
      &copy; 2026 <strong style="color:#fff;">JoseLuis0022</strong> &mdash; IBERO &middot;
      <a href="https://github.com/JoseLuis0022" rel="noopener" target="_blank">GitHub</a> &middot;
      <a href="https://creativecommons.org/licenses/by/4.0/" rel="license noopener" target="_blank">CC BY 4.0</a> &middot;
      <a href="{{ '/uso-ia/' | relative_url }}">Uso de IA</a>
    </p>
    <p class="custom-footer__modified">
      <strong>Última modificación:</strong>
      {{ modified | date: "%d %b %Y" }}
    </p>
  </div>
</footer>
