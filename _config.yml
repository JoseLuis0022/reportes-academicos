title: Reportes Académicos – IA Generativa
description: Portafolio de prácticas del curso de IA Generativa (IBERO). Modelos LLM locales, benchmarking, embeddings y más.

# GitHub Pages con Just the Docs
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: "https://JoseLuis0022.github.io"
baseurl: "/reportes-academicos"

# Estilos
just_the_docs:
  custom_css:
    - "assets/css/custom.css"
  footer_content: ""

search_enabled: true
search:
  heading_level: 2

aux_links:
  "Ver en GitHub":
    - "https://github.com/JoseLuis0022/reportes-academicos"

permalink: pretty

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
